name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-check:
    name: 静态自检 (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 是 GitHub 默认、也是插件市场自己的 CI 环境；windows 是我实际验证过
        # 裸检出跑通的环境（开发机是 Windows，本机没有 WSL，所以 Linux 路径没能在
        # 本地实跑）。两个都跑，覆盖面最广，首次跑也能立刻暴露平台差异。
        os: [ubuntu-latest, windows-latest]
        # engines.node 声明的是 ^22.19.0 || >=24.0.0，这里各取一条线验证
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 自检分两半，用一条 `npm test` 跑完：
      #   1) 零依赖的一半 —— verify（清单/命名/命名空间的静态检查）、client-stub-check、
      #      render-check、env-check。它们只读本地源码、把 react 与 ui-primitives 换成桩，
      #      不需要任何 dependencies，这个包也没有构建步骤。
      #   2) preset 端点自检 —— 它要把 lib/index.js 复制成探针模块再 import，而 lib/index.js
      #      静态 import 了 fflate / yaml / @deepseek-ai/dsh-typert-protocol。CI runner 上没有
      #      宿主安装树，npm 上那个包又只发到 0.1.0-rc.6（缺 RemoteError / remoteErrorOf，
      #      插件 peer 要 ^0.2.0-0），所以这一半在 CI 上会自己打印 skip 并以退出码 0 结束，
      #      不会把 CI 弄红；完整覆盖在本地 `npm install`（或用宿主安装树）后跑出来。
      - name: 自检
        run: npm test
